  #wrap.panning{cursor:grabbing}
  #tree{position:absolute;left:50%;top:50%;width:0;height:0}
  #tree svg{position:absolute;left:-600px;top:-600px;width:1200px;height:1200px;overflow:visible}

  #title{font-size:13px;font-weight:700;text-shadow:0 1px 4px #000}
  #title small{display:block;font-size:9px;font-weight:400;opacity:.55;margin-top:2px}
  #hint{font-size:9px;opacity:.5;text-align:right;max-width:170px;line-height:1.4}
  #legend{position:fixed;bottom:12px;left:12px;z-index:5;background:#ffffff0d;border:1px solid #ffffff1a;border-radius:12px;padding:8px 10px;font-size:9px;max-width:190px}
  #legend b{display:block;font-size:10px;margin-bottom:4px}
  #legend span{display:flex;align-items:center;gap:5px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #legend i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  #sheet{position:fixed;left:0;right:0;bottom:0;background:#17172b;border-top:1px solid #ffffff22;border-radius:18px 18px 0 0;padding:16px 18px 28px;transform:translateY(110%);transition:transform .3s;z-index:10}
  #sheet.open{transform:translateY(0)}
  #sheet .n{font-size:18px;font-weight:700}
  #sheet .d{font-size:12px;opacity:.65;margin-top:2px}
  #sheet .close{position:absolute;top:12px;right:16px;font-size:20px;opacity:.5;background:none;border:none;color:#fff;cursor:pointer}
  .btnrow{position:fixed;bottom:12px;right:12px;z-index:6;display:flex;gap:6px}
  .btnrow button{background:#ffffff14;border:1px solid #ffffff2a;color:#e8e8f0;border-radius:9px;width:34px;height:34px;font-size:15px;cursor:pointer}
  .btnrow button:hover{background:#ffffff2a}

  if(Object.keys(ptrs).length===1&&now-lastTap<280){scale=scale>1.4?1:Math.min(MAX,scale*2);apply();lastTap=0;}

document.getElementById('leglist').innerHTML=LINES.map(l=>`<span><i style="background:${l.c}"></i>${l.n}</span>`).join('');
function openSheet(n){document.getElementById('s_name').textContent=n.name;
  document.getElementById('s_dates').textContent=n.d||'dates unknown';document.getElementById('sheet').classList.add('open');}
function closeSheet(){document.getElementById('sheet').classList.remove('open');}
fit();
</script>
