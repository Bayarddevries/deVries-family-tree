<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>deVries · Spence Family Tree</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#14121A;--surface:#1E1A26;--surface2:#272131;--line:#3A3346;
  --txt:#F2E9DC;--muted:#9C8FA9;--crimson:#E0525C;--crimson-d:#8C1F28;
  --gold:#D4A853;--cream:#F5EDE2;
}
html,body{height:100%}
body{background:radial-gradient(1200px 800px at 70% -10%,#241D2E 0%,var(--bg) 55%);color:var(--txt);
  font-family:'EB Garamond',Georgia,serif;overflow:hidden}
h1,h2,h3,.brand,.tab,.node-name{font-family:'Cinzel',serif}
.top{padding:18px 18px 6px;text-align:center}
.brand{font-size:clamp(19px,4.5vw,27px);font-weight:700;color:var(--cream);letter-spacing:.5px}
.brand::after{content:"";display:block;width:56px;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin:7px auto 0}
.brand-sub{font-size:12px;color:var(--muted);font-style:italic;margin-top:5px}
main{position:fixed;inset:58px 0 62px;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;padding:14px 16px 30px;display:none;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.view.active{display:block;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.vhead{font-size:17px;color:var(--cream);border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:12px}

/* ---- tree canvas ---- */
#wrap{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:absolute;inset:0;overflow:hidden}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.cnode{position:absolute;background:linear-gradient(180deg,var(--surface2),var(--surface));
  border:1px solid var(--line);border-radius:12px;padding:7px 9px;text-align:center;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .15s ease,border-color .15s,box-shadow .15s;
  display:flex;flex-direction:column;justify-content:center}
.cnode:active{transform:scale(.97)}
.cnode.you{border-color:var(--crimson);box-shadow:0 0 0 2px rgba(224,82,92,.25),0 6px 18px rgba(0,0,0,.4)}
.cnode .n1,.cnode .n3{font-family:'Cinzel',serif;font-size:12px;color:var(--cream);line-height:1.2;font-weight:600}
.cnode .n2{font-size:13px;color:var(--gold);line-height:1.15}
.cnode .years{font-size:10px;color:var(--muted);margin-top:2px;font-style:italic}
.cnode.person .n1{font-size:12.5px}
.cnode.long .n1,.cnode.long .n3{font-size:10px}
.cnode.long.person .n1{font-size:11px}
.cnode .m{display:inline-block;background:var(--gold);color:#241D2E;font-size:8px;font-weight:700;
  letter-spacing:1px;padding:1px 5px;border-radius:7px;margin-top:3px;align-self:center}
.lane{position:absolute;left:8px;width:118px;font-family:'Cinzel',serif;font-size:12px;color:var(--muted);
  line-height:1.15;padding-top:4px;letter-spacing:.3px;pointer-events:none}
#lanes{position:absolute;left:0;top:0;width:130px;bottom:0;overflow:hidden;pointer-events:none;
  background:linear-gradient(90deg,rgba(20,18,26,.92) 82%,transparent);z-index:5}
canvas#conn{position:absolute;top:0;left:0;pointer-events:none}
.zbtns{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;gap:8px}
.zbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);
  color:var(--cream);font-size:19px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.zbtn:active{transform:scale(.93)}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;color:var(--muted);pointer-events:none}

/* ---- people grid ---- */
.searchbar{position:sticky;top:0;z-index:5;padding:2px 0 10px;background:linear-gradient(180deg,var(--bg) 70%,transparent)}
.searchbar input{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
  color:var(--txt);font-size:15px;font-family:inherit;outline:none}
.searchbar input:focus{border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;padding-bottom:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;
  cursor:pointer;animation:fadeUp .4s ease both;transition:transform .12s,border-color .12s}
.pcard:active{transform:scale(.96)}
.pcard .ava{width:54px;height:54px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:19px;color:var(--cream);background:linear-gradient(135deg,var(--crimson-d),#4A2530);
  border:1px solid var(--crimson-d);overflow:hidden}
.pcard .ava img{width:100%;height:100%;object-fit:cover}
.pcard .pname{font-size:13px;color:var(--cream);line-height:1.25}
.pcard .pyears{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px}
.pcard .mtag{display:inline-block;background:var(--gold);color:#241D2E;font-size:8px;font-weight:700;letter-spacing:1px;padding:1px 5px;border-radius:7px;margin-top:5px}
.pcard .you{color:var(--crimson);font-weight:700}

/* ---- stories ---- */
.scard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;
  padding:14px 16px;margin-bottom:10px;animation:fadeUp .4s ease both}
.scard h3{font-size:14.5px;color:var(--crimson);margin-bottom:6px}
.scard .who{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:8px;display:block}
.scard p{font-size:15px;line-height:1.5;color:var(--txt)}
.scard .srclink{display:inline-block;margin-top:10px;font-size:13px;color:var(--gold);text-decoration:none;border:1px solid var(--gold);padding:3px 12px;border-radius:14px}
.scard .srclink:active{background:var(--gold);color:#241D2E}

/* ---- timeline ---- */
.tlist{position:relative;padding-left:22px}
.tlist::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tevent{position:relative;margin-bottom:14px;animation:fadeUp .4s ease both}
.tevent::before{content:"";position:absolute;left:-21px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
.tevent.hist::before{background:var(--muted)}
.tevent .yr{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);font-weight:700}
.tevent p{font-size:14px;color:var(--txt);line-height:1.4;margin-top:1px}

/* ---- tab bar ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;height:62px;display:flex;background:rgba(20,18,26,.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:50}
.tab{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.5px;transition:color .2s}
.tab .ti{font-size:19px;line-height:1}
.tab.active{color:var(--gold)}
.tab.active .ti{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.2)}100%{transform:scale(1)}}

/* ---- bottom sheet ---- */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .28s ease;z-index:60}
#backdrop.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;background:var(--surface);border-radius:22px 22px 0 0;
  border-top:1px solid var(--line);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);z-index:70;
  overflow-y:auto;scrollbar-width:thin;padding:12px 20px 34px}
#sheet.open{transform:translateY(0)}
.sheet-handle{width:44px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);font-size:19px;cursor:pointer}
.shead{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.shead .sava{width:76px;height:76px;border-radius:16px;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,var(--crimson-d),#4A2530);
  display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:26px;color:var(--cream);border:1px solid var(--line)}
.shead .sava img{width:100%;height:100%;object-fit:cover}
.shead .sname{font-family:'Cinzel',serif;font-size:19px;color:var(--cream)}
.shead .smeta{font-size:13px;color:var(--muted);font-style:italic;margin-top:3px}
.smeta .mtag{font-style:normal;background:var(--gold);color:#241D2E;font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:8px;margin-left:6px}
.snote{font-size:15px;line-height:1.5;color:var(--txt);margin-bottom:12px}
.sstory{background:var(--surface2);border-left:3px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.sstory p{font-size:14.5px;line-height:1.5;color:var(--txt)}
.sstory .srclink{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--gold);text-decoration:none;border:1px solid var(--gold);padding:2px 10px;border-radius:12px}
.srel{margin-top:6px}
.srel h4{font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase}
.srel .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:4px 12px;font-size:13px;color:var(--cream);cursor:pointer}
.chip:active{border-color:var(--gold)}
.chip.metis{border-color:var(--gold)}
.chip.you{border-color:var(--crimson);color:var(--crimson)}
</style><style>.f3 {
  --female-color: rgb(196, 138, 146);
  --male-color: rgb(120, 159, 172);
  --genderless-color: lightgray;
  --background-color: rgb(33, 33, 33);
  --text-color: #fff;

  font-family: 'Roboto', sans-serif;
}

.f3 * {
  box-sizing: border-box;
}

.f3 .cursor-pointer {
  cursor: pointer;
}
.f3 svg.main_svg {
  width: 100%;
  height: 100%;
}
.f3 svg.main_svg text {
  fill: currentColor;
}
.f3 rect.card-female, .f3 .card-female .card-body-rect, .f3 .card-female .text-overflow-mask {
  fill: var(--female-color);
}
.f3 rect.card-male, .f3 .card-male .card-body-rect, .f3 .card-male .text-overflow-mask {
  fill: var(--male-color);
}
.f3 .card-genderless .card-body-rect, .f3 .card-genderless .text-overflow-mask {
  fill: var(--genderless-color);
}
.f3 .card_add .card-body-rect {
  fill: #3b5560;
  stroke-width: 4px;
  stroke: #fff;
  cursor: pointer;
}
.f3 g.card_add text {
  fill: #fff;
}
.f3 .card-main-outline {
  stroke: currentColor;
  stroke-width: 3px;
}
.f3 .card_family_tree rect {
  transition: 0.3s;
}
.f3 .card_family_tree:hover rect {
  transform: scale(1.1);
}
.f3 .card_add_relative {
  cursor: pointer;
  color: #fff;
  transition: 0.3s;
}
.f3 .card_add_relative circle {
  fill: rgba(0, 0, 0, 0);
}
.f3 .card_add_relative:hover {

}
.f3 .card_edit.pencil_icon {

  transition: 0.3s;
}
.f3 .card_edit.pencil_icon:hover {

}
.f3 .card_break_link, .f3 .link_upper, .f3 .link_lower, .f3 .link_particles {
  transform-origin: 50% 50%;
  transition: 1s;
}
.f3 .card_break_link {
  color: #fff;
}
.f3 .card_break_link.closed .link_upper {
  transform: translate(-140.5px, 655.6px);
}
.f3 .card_break_link.closed .link_upper g {
  transform: rotate(-58deg);
}
.f3 .card_break_link.closed .link_particles {
  transform: scale(0);
}
.f3 .input-field input {
  height: 2.5rem !important;
}
.f3 .input-field > label:not(.label-icon).active {
  -webkit-transform: translateY(-8px) scale(0.8);
  transform: translateY(-8px) scale(0.8);
}
.f3.f3-cont {
  width:100%;
  height:900px;
  max-height:70vh;
  background-color: var(--background-color);
  color: var(--text-color);
}
.f3 {
  position: relative;
  display: flex;
}




/* form-info */
.f3-form input[type="text"],
.f3-form textarea,
.f3-form select {
  width: 100%;
  padding: 8px 12px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 4px;
  box-sizing: border-box;
  font-size: 14px;
  background: var(--background-color);
  color: currentColor;
}

.f3-form input[type="text"]:focus,
.f3-form textarea:focus,
.f3-form select:focus {
  box-shadow: 0 0 5px rgba(76, 175, 80, 0.2);
}

.f3-form button {
  padding: 10px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  margin: 10px 0;
  transition: background-color 0.3s ease-in-out, border-color 0.3s ease-in-out, color 0.3s ease-in-out;
}

.f3-form button[type="submit"] {
  background-color: #4CAF50;

}

}

}

.f3-delete-btn:hover {

}

.f3-delete-btn:disabled {
  opacity: 0.5;
  background-color: transparent;

}

.f3-form .f3-remove-relative-btn {

  border: 1px solid currentColor;
  color: currentColor;
  width: 100%;
  padding: 5px 10px;
}

.f3-remove-relative-btn:hover, .f3-remove-relative-btn.active {
  background-color: var(--text-color);
  border-color: var(--text-color);

.f3-radio-group {
  margin: 15px 0;
}

.f3-radio-group label {
  margin-right: 15px;
  cursor: pointer;
}

.f3-radio-group input[type="radio"] {
  margin-right: 5px;
}

.f3-info-field-label, .f3-form-field label {
  font-weight: bold;
  font-size: 12px;
  display: block;
  opacity: 0.8;
}

.f3-info-field-value {
  font-weight: normal;

  border-bottom: 1px solid rgba(255,255,255,0.2);

}

}

}

.f3-form.non-editable .f3-form-buttons,
.f3-form.non-editable .f3-delete-btn,
.f3-form.non-editable .f3-remove-relative-btn,
.f3-form.non-editable .f3-link-existing-relative {
  display: none;
}

.f3-close-btn {
  cursor: pointer;
  position: absolute;
  left: 10px;
  top: 8px;
  font-size: 30px;
  color: var(--text-color);
}

.f3-edit-btn {
  position: relative;
  top: -1px;
  width: 24px;
  height: 24px;
  cursor: pointer;
  display: inline-block;
}

.f3-add-relative-btn {
  cursor: pointer;
  width: 27px;
  height: 27px;
  margin-right: 5px;
  display: inline-block;
}

/* card-html */

.f3 div.card {
  cursor: pointer;
  color: var(--text-color);
  position: relative;
  line-height: 1.2;
}

.f3 div.card-image-circle {
  border-radius: 50%;
  padding: 5px;
  width: 90px;
  height: 90px;
}

.f3 div.card-image-circle div.card-label {

}

.f3 div.card-image-circle svg {

}

.f3 div.card-image-circle img {

  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}

.f3 div.card-rect {

  width: 120px;

}


.f3 div.card-image-rect {
  width: 200px;

}

.f3 div.card-image-rect .person-icon {
  height: 70px;
  width: 70px;
  object-fit: cover;
  flex: 0 0 auto;
  padding: 5px;
  margin-right: 10px;
}

.f3 div.card-image-rect img {
  height: 70px;
  width: 70px;
  object-fit: cover;
  flex: 0 0 auto;
  padding: 5px;
  margin-right: 10px;

}

.f3 div.card-image-rect svg {

}

}
.f3 div.card-male .card-inner, .f3 div.card-male .person-icon svg {

}

}

.f3 div.card-to-add .card-inner .card-label {
  margin: 0 auto;
}

.f3 div.card-to-add .person-icon {
  display: none;
}

.f3 div.card-new-rel .card-inner {
  border-width: 1px;
  border-style: dashed;
  outline: 0px !important;
}
.f3 div.card-new-rel.card-female .card-inner, .f3 div.card-to-add.card-female .card-inner {
  border-color: var(--female-color);
  color: var(--female-color);
}
.f3 div.card-new-rel.card-male .card-inner, .f3 div.card-to-add.card-male .card-inner {
  color: var(--male-color);
  border-color: var(--male-color);
}

.f3 div.card-unknown .card-inner {
  background-color: var(--background-color);
  border: 1px solid;
}

.f3 div.card-unknown .card-inner .card-label {
  margin: 0 auto;
}

.f3 div.card-unknown .person-icon {
  display: none;
}

.f3 div.card-new-rel .card-inner {
  border-width: 1px;
  border-style: dashed;
  outline: 0px !important;
}
.f3 div.card-new-rel.card-female .card-inner, .f3 div.card-unknown.card-female .card-inner {
  border-color: var(--female-color);
  color: var(--female-color);
}
.f3 div.card-new-rel.card-male .card-inner, .f3 div.card-unknown.card-male .card-inner {
  color: var(--male-color);
  border-color: var(--male-color);
}

.f3 div.card:hover > div {
  transform: translate(0, -2px);
}
.f3 div.card-main .card-inner, .f3 div.card:hover .card-inner {
  box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.8);
}

.f3 div.card-main .card-inner {
  outline: 4px solid rgba(220, 220, 220, 1);
}

.f3 div.card-inner.f3-path-to-main {
  outline: 4px solid rgba(255, 255, 255, 1);
}

.f3 .link {
  transition: stroke-width 0.2s ease-in-out;
}

.f3 .link.f3-path-to-main {
  stroke-width: 4px;
}





.f3-form-cont {
  position: relative;
  z-index: 6;
  right: 0;
  top: 0;
  width: 0;
  height: 100%;
  background-color: var(--background-color);
  overflow: auto;
  flex: 0 0 auto;
  box-shadow: 0 0 10px 0 rgba(0, 0, 0, 0.5);
}

.f3-form-cont.opened {
  width: 350px;
}

.f3-form {
  padding: 20px;
}

.f3-form hr {
  border-style: solid; 
  border-width: thin 0 0 0;
  opacity: 0.15;
}

.f3-nav-cont {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
}

.f3-history-controls {
  padding: 8px 5px 7px 9px;
  display: inline-block;
  position: relative;
  z-index: 2;
}

.f3-back-button, .f3-forward-button {
  width: 30px;
  height: 30px;
  transition: opacity 0.3s ease;
  cursor: pointer;
  display: inline-block;
  background-color: transparent;
  border: none;
  margin-right: 10px;
  color: currentColor;
}

.f3-history-controls svg {
  height: 100%;
}

.f3-back-button.disabled, .f3-forward-button.disabled {
  opacity: 0.5;
}

.f3-modal {
  display: none;
  position: absolute;
  z-index: 10;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgb(0,0,0);
  background-color: rgba(0,0,0,0.4);
}

.f3-modal-content {
  position: relative;
  background-color: var(--background-color);
  margin: 15% auto;
  padding: 20px;
  border: 1px solid #888;
  border-radius: 5px;
  width: 500px;
  max-width: 90%;
}

.f3-modal-close {
  color: #aaa;
  position: absolute;
  right: 10px;
  top: 7px;
  font-size: 28px;
  font-weight: bold;
}

.f3-modal-close:hover,
.f3-modal-close:focus {
  color: black;
  text-decoration: none;
  cursor: pointer;
} 

.f3-popup {
  position: fixed;
  box-shadow: 0 0 10px 0 rgba(0, 0, 0, 0.8);
}

.f3-popup-content {
  position: relative;
  background-color: var(--background-color);
  border: 1px solid #888;
  border-radius: 5px;
  overflow: hidden;
  width: 100%;
  height: 100%;
}

.f3-popup-nav {
  height: 20px;
}

.f3-popup-content-inner {
  width: 100%;
  height: 100%;
}

.f3-popup-close {
  color: #aaa;
  position: absolute;
  z-index: 4;
  right: 6px;
  top: 1px;
  font-size: 28px;
  font-weight: bold;
  line-height: 1;
}

.f3-popup-close:hover,
.f3-popup-close:focus {
  color: black;
  text-decoration: none;
  cursor: pointer;
} 



.f3-btn {
  position: relative;
  cursor: pointer;
  padding: 5px 10px;

  overflow: hidden;

  border-width: 0;
  outline: none;
  border-radius: 3px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .6);
  
  background-color: var(--text-color);
  color: var(--background-color);
  
  transition: background-color .3s;
  font-size: 14px;
}

.f3-btn:hover, .f3-btn:focus {
  background-color: var(--background-color);
  color: var(--text-color);
}

.f3-female-bg {
  background-color: var(--female-color);
}

.f3-male-bg {
  background-color: var(--male-color);
}

.f3-genderless-bg {
  background-color: var(--genderless-color);
}

.f3-female-color {
  color: var(--female-color);
}

.f3-male-color {
  color: var(--male-color);
}

.f3-genderless-color {
  color: var(--genderless-color);
}

.f3-autocomplete-cont {
  position: relative;
  display: inline-block;
  z-index: 2;
  font-size: 14px;
  width: 200px;
}

.f3-autocomplete input {
  border: 1px solid rgba(255, 255, 255, 0.2);
  background-color: var(--background-color);
  color: var(--text-color);
  padding: 10px;
  width: 100%;
}
.f3-autocomplete input:focus {
  outline: none;
}

.f3-autocomplete-toggle {
  position: absolute;
  right: 10px;
  top: 10px;
  cursor: pointer;
  color: var(--text-color);
  transition: color 0.3s ease-in-out;
  width: 20px;
}

.f3-autocomplete-items {
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-top: none;
  overflow-y: auto;
  max-height: 0;
  background-color: var(--background-color);
  transition: max-height 0.3s ease-in-out;
}

.f3-autocomplete.active .f3-autocomplete-items {
  max-height: 300px;
}

.f3-autocomplete-item > div {
  padding: 10px;
  cursor: pointer;
  background-color: var(--background-color);
  border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out;
}
.f3-autocomplete-item > div:hover, .f3-autocomplete-item.f3-selected > div {
  background-color: var(--text-color);
  color: var(--background-color);
}

.f3-autocomplete-active {
  background-color: DodgerBlue !important;
  color: #ffffff;
}

.f3-kinship-info {
  padding: 10px 20px;
}

.f3-kinship-info .f3-info-field {
  color:#b3b01e
}

.f3-kinship-info-icon {
  cursor:pointer;
  display:inline-block;
  width:18px;
  height:18px;
  color:#04a4f4;
  position:relative;
  top:4px;
  left:2px;
}

.f3-kinship-info .f3 {
  width:100%;
  height: 100%;
  position:relative;
  background-color:rgb(33,33,33);
  color:#fff;
}

.f3 .f3-kinship-info .card-kinship-self {
  min-height: 0px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background-color: var(--background-color) !important;
  border: solid 3px;
  color: #437fae;
  font-weight: bold;
}

.f3 .f3-kinship-info .card-kinship-self.f3-real-label {
  width: 150px;
  height: 50px;
  border-radius: 50px;
}

.f3 .f3-kinship-info .card-kinship-rel {
  min-height: 0px;
  width: 150px;
  height: 50px;
  border-radius: 50px;
  background-color: #1d3456 !important;
  font-weight: bold;
}

.f3 .f3-kinship-info .card-kinship-default {
  min-height: 0px;
  width: 150px;
  height: 50px;
  border-radius: 50px;
  background-color: var(--background-color) !important;
  border: solid 1px;
}

.f3-kinship-labels-toggle {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 10;
  font-size: 12px;
}

.f3-kinship-labels-toggle label {
  cursor: pointer;
  color: #fff;
  font-weight: bold;
  text-align: center;
  padding: 2px 5px;
}

.f3-kinship-labels-toggle input[type="checkbox"] {
  cursor: pointer;
  margin-left: 5px;
  margin-right: 5px;
  margin-top: 5px;
  margin-bottom: 5px;
}

/* ---- family-chart dark theme ---- */
.f3{background:transparent;color:#F2EBD9;font-family:'EB Garamond',serif}
#FamilyChart{position:absolute;inset:58px 0 62px;background:var(--bg,#16141c)}
#FamilyChart .card{background:#241D2E;border:1px solid #3a3346;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.45)}

#FamilyChart .card[data-id="P050"] .card-inner{outline:2px solid #D4A853;border-radius:10px}

<header class="top">

<main>
  <section id="view-tree" class="view active">
    <div id="FamilyChart" class="f3"></div>
    <div class="zbtns">

      <button class="zbtn" id="zout">−</button>

  <section id="view-people" class="view">

    <div id="peoplegrid" class="grid"></div>

  <section id="view-stories" class="view">
    <h2 class="vhead">Stories &amp; Profiles</h2>

  </section>

  <section id="view-timeline" class="view">

</main>

<nav class="tabbar">

</nav>

pregnant with their fourth child [Verify vs primary records.]", "source": "https://www.redriverancestry.ca/SPENCE-JAMES-1753.php"}, "P002": {"title": "Margaret 'Nestichio' Batt — the Métis matriarch", "text": "Born 1757, daughter of Isaac Batt (c1725-1791), an English HBC inland trader, and an unnamed Cree woman — the matrilineal Métis root of this line. She grew up in the fur-trade world of York Factory, where the young Orkney voyageur James Spence began courting her when she was 16. Family oral tradition (preserved in several written versions since the 1800s) tells that as a girl she was kidnapped by the Blackfeet and her mother asked James to rescue her; after many failed attempts he succeeded using a relay of horses, then waited until she was older to marry her. Over the years they had four children: James, Andrew, George, and Margaret 'Peggy' (your direct ancestor, born 1795/96 just after James Sr died at Buckingham House). Widowed at 38 and pregnant, she raised the four children, returning to York Factory then the Red River Settlement. In 1821 all her children married at Red River — including Peggy to Andrew Setter, joining the Spence and Setter lines. Margaret died in 1829 at Red River Settlement. NOTE: the kidnapping tale is a cherished oral tradition, not a primary record; a variant says it was her daughter Peggy who was rescued by Andrew Setter [Verify vs primary records.]", "source": "https://www.redriverancestry.ca/SPENCE-JAMES-1753.php"}, "P007": {"title": "Andrew Setter — the Orkney voyageur", "text": "Andrew Setter (1777–1870) was born in Westray, Orkney and joined the Hudson's Bay Company at York Factory in 1800. On 28 Jan 1821 he married Peggy Spence at Beaver Creek, baptised by Rev. John West. Their son George carried the family's Métis lineage forward. Andrew's line is the paternal thread that joined the Spence family.", "source": "HBC records; Rev. John West baptism 1821"}, "P030": {"title": "David Spence — MLA, Convention of Forty delegate, Métis leader", "text": "David Spence (b. 5 Sep 1824, St. John's parish; d. 16 Sep 1885) was a Scottish Half-Breed, son of James Spence and his second wife Jane Morwick, both Métis — his mother was grandmother to Manitoba's first Premier, John Norquay. He married Catherine Hallett on 15 Feb 1844 at St. John's (daughter of Henry Hallett and Catherine Parenteau). He represented St. Anne's at the 1870 Convention of Forty, and in 1877 the family moved to lot #62 at Poplar Point. He was elected the first MLA from Poplar Point on 27 Dec 1870 and served 1870-74, also serving as Justice of the Peace for Poplar Point and Marquette. Métis scrip was issued to David and Catherine on 2 Oct 1876. Catherine died in 1880. David was accidentally shot in his own home by a neighbour who thought the rifle was unloaded, and died of the wound on 16 Sep 1885.", "source": "https://www.metismuseum.ca/media/document.php/12539.Convention%20of%20Forty%20revised.pdf"}, "P022": {"title": "Elizabeth Setter — married a Premier", "text": "Daughter of George Setter; in 1862 married John Norquay, who in 1878 became Manitoba's first Métis Premier. Through her, this family connects to Manitoba's provincial founding [Verify vs primary records.]", "source": "https://www.redriverancestry.ca/SETTER-GEORGE-1815.php"}, "P051": {"title": "Premier John Norquay — cousin by marriage", "text": "Manitoba's first Métis Premier (1878-87). Married Elizabeth Setter, daughter of George Setter. A towering figure in early Manitoba politics [Verify vs primary records.]", "source": "https://www.redriverancestry.ca/NORQUAY-JOHN-1841.php"}, "P067": {"title": "Gerhard & Geeske De Vries — Dutch settlers", "text": "Dutch immigrants from Friesland, Netherlands. Married 4 Oct 1929 in Ochre River MB; homesteaded on the south shore of Lake Dauphin in the Turtle River District. Raised 11 children on the farm.", "source": "https://www.sneathstrilchuk.com/obituary/Leonard-DeVries"}, "P049": {"title": "Bryon Edward deVries — HR Director, family man", "text": "Born 17 Jul 1954; died 13 Oct 2019. Director of Human Resources at Sunrise School Division (and previously WRHA). Remembered for hosting Sunday family dinners for 20+ years, coaching soccer, and his devotion to helping anyone.", "source": "https://www.ethicaldeathcare.com/obits/devries-bryon"}, "P046": {"title": "Mavis Irene (Hamilton) Lau", "text": "Born 1 Sep 1933 in Tisdale SK; moved to Flin Flon at 6. Only daughter of six children. A remarkable seamstress, knitter, cross-stitcher, curler, golfer and bridge player; worked at Sears in Flin Flon until retirement.", "source": "https://www.tributearchive.com/obituaries/18111241/mavis-lau"}, "P079": {"title": "Isaac Batt — English fur-trader, your Métis gateway", "text": "Isaac Batt (c1725-1791) was an English Hudson's Bay Company trader born in Hertfordshire, England. He contracted with the HBC in 1754 as a labourer at York Factory (£10/yr) and rose to be an experienced inland canoeman, steersman and trader. He travelled inland under the personal guidance of leading Cree chiefs (Wapinesiw, Matonabbee) and worked alongside Samuel Hearne trying to establish Cumberland House. Illiterate, he never rose past £20/yr as literate juniors outranked him; in 1775 he briefly deserted to rival 'Pedlar' traders, returning in 1777. He had a Cree family by 1777 — his daughter Margaret 'Nestichio' Batt is the Métis root of this line. He died in summer 1791 near Manchester House, shot through the head by an Indian guide during a buffalo hunt, the first HBC servant killed by Indians in the Saskatchewan area. James Spence Sr's 1795 will left legacies to 'his Indian Wife Nestichio, daughter of the deceased Isaac Batt' and their four children, confirming the link in primary records.", "source": "https://www.biographi.ca/en/bio/batt_isaac_4E.html"}, "P042": {"title": "Ella Alberta Riggs — where the two lines meet", "text": "Ella (b. c1880s) was the daughter of Ernest C. Riggs and Mary Ann Spence. Through her mother she carries Spence line B: Mary Ann was the daughter of David Spence (Métis MLA and Convention of Forty delegate) and Catherine Hallett. Ella married Alan Setter on 31 Mar 1909 at Portage la Prairie (reg. 1909,001530). Because Alan descends from line A (Peggy Spence), Ella is the point where Bayard's two Spence lines converge. Their daughter Doris inherited her mother's middle name, 'Alberta'. [Verify Ella's exact birth year vs vital records.]", "source": "vital stats reg. 1909,001530"}, "P044": {"title": "Doris Alberta Setter — the bridge to the Hamiltons", "text": "Doris (b. 24 Dec 1912, Portage la Prairie; reg. 1912,004481; d. 23 Apr 2006) was the daughter of Alan Setter and Ella Alberta Riggs. On 29 Dec 1932 she married Lawrence Donald Hamilton at Tisdale, Saskatchewan. Their only daughter, Mavis Irene, was born 1 Sep 1933 in Tisdale and became the mother of Bayard's mother, Tracy. Doris is the hinge joining the Setter/Spence family to the Hamilton line.", "source": "vital stats regs 1912,004481; SK marriage record 1932"}, "P045": {"title": "Lawrence Donald Hamilton — the Flin Flon connection", "text": "Lawrence (b. 15 Jun 1912, Tisdale SK; d. 5 Feb 1984, Flin Flon MB) was the son of Guy Wentworth Hamilton and Ethel Rose King. He married Doris Setter in 1932. The family moved to Flin Flon, Manitoba, in 1939 (when Mavis was six), which is how Bayard's maternal line came to Flin Flon. Also recorded as 'Laurence'.", "source": "family research; Flin Flon move c.1939"}, "P043": {"title": "Alan Setter — Spence line A", "text": "Alan (b. 22 Oct 1884, R.M. Portage la Prairie; reg. 1884,005103; d. 1964; also spelled 'Sutter') was the son of Roderick McKenzie Setter and Sarah Ann Howrie. Roderick was the son of George Setter and Jessie Ellen Campbell. Alan's marriage to Ella Alberta Riggs in 1909 is the meeting point of the two Spence lines. He was Bayard's great-grandfather.", "source": "vital stats reg. 1884,005103"}, "P033": {"title": "Catherine Hallett — wife of the MLA", "text": "Catherine Hallett (1824–1880) was the daughter of Henry Hallett and Catherine Parenteau. She married David Spence on 15 Feb 1844 at St. John's parish, Red River. In 1876, as a Métis family, she and David received Métis scrip. Their daughter Mary Ann Spence became the grandmother of Ella Riggs. [Verify the Catherine Hallett death date: 1880 vs 1887.]", "source": "parish record 1844; scrip 1876"}, "P029": {"title": "Jane Morwick — grandmother of a Premier", "text": "Jane Morwick (1794–1874) was a widow (née Morwick, previously married into the Norquay family) when she married James Spence Jr. She is the grandmother of Premier John Norquay, Manitoba's first Méis Premier, who was raised in the Spence household. Through Jane and James Jr, their son David Spence continued the family's public life in Red River.", "source": "family research; Norquay genealogy"}, "P010": {"title": "George Setter — the middle bridge", "text": "George Setter (1815–1899) was the son of Andrew Setter (an Orkney HBC voyageur) and Peggy Spence (a daughter of James Spence Sr and Margaret 'Nestichio' Batt). He married Isabella Kennedy (d. 1846), then Jessie Ellen Campbell. His son Roderick McKenzie Setter (by Jessie) carried line A down to Alan Setter.", "source": "redriverancestry.ca; family research"}, "P019": {"title": "Jessie Ellen Campbell — second wife, and a key correction", "text": "Jessie Ellen Campbell (1824–1912) married George Setter after Isabella Kennedy's death in 1846, and was the mother of Roderick McKenzie Setter. The research corrects an earlier assumption: Roderick was Jessie's son, NOT Isabella's. This matters because it pins line A's descent through Jessie. [Line A ancestress = Jessie Ellen Campbell.]", "source": "family research; corrected lineage"}, "P025": {"title": "Roderick McKenzie Setter — completing line A", "text": "Roderick McKenzie Setter (b. 1856) was the son of George Setter and Jessie Ellen Campbell. He married Sarah Ann Howrie, and their son Alan Setter const D = __DATA__;
const people = Object.fromEntries(D.people.map(p=>[p.id,p]));
const P = D.people;
const byName = {};
P.forEach(p=>byName[p.name.toLowerCase()]=p);

/* ---------- family-chart tree ---------- */
var chart = window.f3.createChart('#FamilyChart', D.tree.fcData);
chart.setCardHtml().setCardDisplay([["name"],["years"]]);
chart.setAncestryDepth(30).setProgenyDepth(30);
chart.setShowSiblingsOfMain(true);
chart.setDuplicateBranchToggle(true);   // lets you collapse the two converging branches
chart.setTransitionTime(350);
// tap a card -> profile sheet
document.getElementById('FamilyChart').addEventListener('click', function(ev){
  var card = ev.target.closest('.card');
  if(card && card.dataset.id){ ev.preventDefault(); openSheet([card.dataset.id.replace(/--x\d+$/,'')]); }
}, true);
function chartReset(){ try{ chart.updateTree({tree_position:'fit', transition_time:350}); }catch(e){} }
// in-tree search: finds ANY of the 91 people and centres on them
try{
  chart.setPersonDropdown(function(d){ return d.data.name; }, {
    placeholder:'Find someone…',
    onSelect:function(id){ try{ chart.updateMainId(id); chart.updateTree({tree_position:'main_to_middle', transition_time:400}); }catch(e){} }
  });
}catch(e){}
chart.updateTree({initial:true, tree_position:'fit'});
// zoom buttons
var zsvg = document.getElementById('FamilyChart').querySelector('svg');
function zoomBy(f){
  if(!zsvg || !zsvg.__zoom) return;
  try{ var t=d3.zoomTransform(zsvg);
    d3.select(zsvg).transition().duration(200).call(zsvg.__zoom.transform, d3.zoomIdentity.translate(t.x,t.y).scale(t.k*f)); }catch(e){}
}
document.getElementById('zin').onclick=()=>zoomBy(1.25);
document.getElementById('zout').onclick=()=>zoomBy(0.8);
document.getElementById('zfit').onclick=chartReset;

function escH(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function yrs(p){const b=p.birth,dd=p.death;
  if(b&&dd)return b+'–'+dd; if(b)return 'b. '+b; if(dd)return 'd. '+dd; return '';}
function fmtYears(p){return yrs(p);}
function initials(nm){return nm.split(/[\s-]+/).filter(w=>w[0]&&w[0]===w[0].toUpperCase()&&w.length>1).slice(0,2).map(w=>w[0]).join('')||nm.slice(0,2).toUpperCase();}

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const tab=t.dataset.tab;
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    const v=document.getElementById('view-'+tab);v.classList.add('active');
    if(tab==='tree')setTimeout(()=>{try{chartReset();}catch(e){}},80);
  });
});

/* ---------- people grid ---------- */
const grid=document.getElementById('peoplegrid');
function renderPeople(filter){
  const q=(filter||'').toLowerCase();
  const list=P.filter(p=>!q||p.name.toLowerCase().includes(q)||(p.note||'').toLowerCase().includes(q));
  grid.innerHTML='';
  list.forEach((p,i)=>{
    const c=document.createElement('div');
    c.className='pcard';c.style.animationDelay=(i%20)*0.02+'s';
    const img=D.images[p.id]?`<img src="${D.images[p.id]}" alt="">`:'';
    const metis=p.metis?'<span class="mtag">MÉTIS</span>':'';
    const you=p.you?' <span class="you">★ you</span>':'';
    c.innerHTML=`<div class="ava">${img||escH(initials(p.name))}</div><div class="pname">${escH(p.name)}${you}</div><div class="pyears">${escH(fmtYears(p))}</div>${metis}`;
    c.addEventListener('click',()=>openSheet([p.id]));
    grid.appendChild(c);
  });
}
document.getElementById('search').addEventListener('input',e=>renderPeople(e.target.value));
renderPeople('');

/* ---------- stories ---------- */
const sl=document.getElementById('storylist');
Object.entries(D.stories).forEach(([pid,s],i)=>{
  const p=people[pid];if(!p)return;
  const img=D.images[pid]?'':''; // story cards stay text-forward
  const card=document.createElement('div');
  card.className='scard';card.style.animationDelay=(i%8)*0.05+'s';
  const src=s.source?`<a class="srclink" href="${escH(s.source)}" target="_blank" rel="noopener">source ↗</a>`:'';
  card.innerHTML=`<h3>${escH(s.title)}</h3><span class="who">${escH(p.name)}</span><p>${escH(s.text)}</p>${src}`;
  sl.appendChild(card);
});

/* ---------- timeline ---------- */
const tl=document.getElementById('timelinelist');
D.timeline.forEach(([year,kind,text],i)=>{
  const d=document.createElement('div');
  d.className='tevent'+(kind==='h'?' hist':'');d.style.animationDelay=(i%10)*0.03+'s';
  d.innerHTML=`<div class="yr">${year}</div><p>${escH(text)}</p>`;
  tl.appendChild(d);
});

/* ---------- bottom sheet ---------- */
const sheet=document.getElementById('sheet'),backdrop=document.getElementById('backdrop');
function openSheet(ids){
  const ps=ids.map(id=>people[id]).filter(Boolean);
  const b=document.getElementById('sheetbody');
  if(ps.length===2){
    const [p1,p2]=ps;
    const img1=D.images[p1.id]?`<img src="${D.images[p1.id]}" alt="">`:'';
    const img2=D.images[p2.id]?`<img src="${D.images[p2.id]}" alt="">`:'';
    const u=D.unions.find(x=>(x.s1===p1.id&&x.s2===p2.id)||(x.s1===p2.id&&x.s2===p1.id));
    let h=`<div class="shead">
      <div class="sava">${img1||escH(initials(p1.name))}</div>
      <div><div class="sname">${escH(p1.name)} <span class="mtag">${p1.metis?'MÉTIS':''}</span></div>
      <div class="smeta">${escH(fmtYears(p1))}</div>
      <div class="sname" style="font-size:16px;margin-top:6px">${escH(p2.name)} <span class="mtag">${p2.metis?'MÉTIS':''}</span></div>
      <div class="smeta">${escH(fmtYears(p2))}</div></div></div>`;
    const notes=[p1.note,p2.note].filter(Boolean).map(n=>`<div class="snote">${escH(n)}</div>`).join('');
    h+=notes;
    // union note
    if(u&&u.note)h+=`<div class="snote" style="color:var(--gold)">${escH(u.note)}</div>`;
    // story for either
    [p1,p2].forEach(p=>{
      const s=D.stories[p.id];
      if(s)h+=`<div class="sstory"><p>${escH(s.text)}</p>${s.source?`<a class="srclink" href="${escH(s.source)}" target="_blank" rel="noopener">source ↗</a>`:''}</div>`;
    });
    // relatives
    h+=relativesBlock(u);
    b.innerHTML=h;
  }else{
    const p=ps[0];
    const img=D.images[p.id]?`<img src="${D.images[p.id]}" alt="">`:'';
    let h=`<div class="shead"><div class="sava">${img||escH(initials(p.name))}</div>
      <div><div class="sname">${escH(p.name)} ${p.you?'<span class="mtag">★ you</span>':''}${p.metis?' <span class="mtag">MÉTIS</span>':''}</div>
      <div class="smeta">${escH(fmtYears(p))}${p.living?' · living':''}</div></div></div>`;
    if(p.note)h+=`<div class="snote">${escH(p.note)}</div>`;
    const s=D.stories[p.id];
    if(s)h+=`<div class="sstory"><p>${escH(s.text)}</p>${s.source?`<a class="srclink" href="${escH(s.source)}" target="_blank" rel="noopener">source ↗</a>`:''}</div>`;
    h+=relativesBlock(null,p.id);
    b.innerHTML=h;
  }
  sheet.classList.add('open');backdrop.classList.add('show');
}
function relativesBlock(union,pid){
  const h=[];
  const parents=new Set(),sibs=[],children=[],spouses=[];
  D.unions.forEach(u=>{
    const s1=people[u.s1],s2=people[u.s2];
    if(u.children.includes(pid)){
      parents.add(u.s1);parents.add(u.s2);
      sibs.push(...u.children.filter(c=>c!==pid));
    }
    if(u.s1===pid){spouses.push(u.s2);children.push(...u.children);}
    if(u.s2===pid){spouses.push(u.s1);children.push(...u.children);}
  });
  if(parents.size){
    h.push(`<div class="srel"><h4>Parents</h4><div class="chips">${[...parents].map(id=>chip(id)).join('')}</div></div>`);
  }
  if(spouses.length){
    h.push(`<div class="srel"><h4>Spouse${spouses.length>1?'s':''}</h4><div class="chips">${spouses.map(id=>chip(id)).join('')}</div></div>`);
  }
  if(children.length){
    h.push(`<div class="srel"><h4>Children</h4><div class="chips">${children.map(id=>chip(id)).join('')}</div></div>`);
  }
  if(sibs.length){
    h.push(`<div class="srel"><h4>Siblings</h4><div class="chips">${sibs.map(id=>chip(id)).join('')}</div></div>`);
  }
  return h.join('');
}
function chip(id){
  const p=people[id];if(!p)return'';
  const cls=p.metis?' chip metis':''+(p.you?' chip you':'');
  return `<button class="chip${cls}" data-id="${id}">${escH(p.name)}</button>`;
}
document.getElementById('sheetbody').addEventListener('click',e=>{
  const c=e.target.closest('.chip');
  if(c){const id=c.dataset.id;openSheet([id]);}
});
function closeSheet(){sheet.classList.remove('open');backdrop.classList.remove('show');}
document.getElementById('sheetclose').onclick=closeSheet;
backdrop.addEventListener('click',closeSheet);

</script>
</body></html>
