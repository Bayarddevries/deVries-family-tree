<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a12;color:#e8e8f0;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100dvh;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(circle at 50% 42%, #1a1a2e 0%, #0a0a12 62%, #05050a 100%)}
  svg{width:100%;height:100%}
  .node{cursor:pointer;transition:transform .28s ease}
  .node:hover circle{filter:brightness(1.5)}
  .nodet{font-size:8px;fill:#e6e6f2;font-weight:600;pointer-events:none;text-anchor:middle;opacity:.95;
    paint-order:stroke;stroke:#0a0a12;stroke-width:2px;stroke-linejoin:round}
  .spoke{stroke-linecap:round;opacity:.13;transition:opacity .28s ease}
  .spoke.focus{opacity:.5}
  #hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none}
  #title{font-size:13px;font-weight:700;letter-spacing:.5px;text-shadow:0 1px 4px #000}
  #title small{display:block;font-size:9px;font-weight:400;opacity:.55;margin-top:2px}
  #hint{font-size:9px;opacity:.5;text-align:right;max-width:150px;line-height:1.4}
  #legend{position:fixed;bottom:12px;left:12px;z-index:5;background:#ffffff0d;backdrop-filter:blur(6px);
    border:1px solid #ffffff1a;border-radius:10px;padding:8px 10px;font-size:9px;max-width:180px}
  #legend b{display:block;font-size:10px;margin-bottom:4px}
  #legend span{display:flex;align-items:center;gap:5px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer;padding:1px 3px;border-radius:4px;transition:background .15s}
  #legend span:hover{background:#ffffff1a}
  #legend i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  #sheet{position:fixed;left:0;right:0;bottom:0;background:#171728;border-top:1px solid #ffffff22;
    border-radius:16px 16px 0 0;padding:16px 18px 26px;transform:translateY(110%);transition:transform .25s ease;z-index:10;box-shadow:0 -8px 40px #000a}
  #sheet.open{transform:translateY(0)}
  #sheet .n{font-size:17px;font-weight:700}
  #sheet .d{font-size:12px;opacity:.65;margin-top:2px}
  #sheet .l{font-size:10px;display:inline-block;margin-top:8px;padding:3px 8px;border-radius:20px;color:#0a0a12;font-weight:700}
  #sheet .close{position:absolute;top:12px;right:16px;font-size:20px;opacity:.5;background:none;border:none;color:#fff;cursor:pointer}
  .grab{cursor:grab}
  .btnrow{position:fixed;bottom:12px;right:12px;z-index:6;display:flex;gap:6px}
  .btnrow button{background:#ffffff14;border:1px solid #ffffff2a;color:#e8e8f0;border-radius:8px;
    padding:6px 10px;font-size:10px;cursor:pointer}
  .btnrow button:hover{background:#ffffff2a}
</style>
</head>

// nodes (created once, transform recomputed on rotate)
const nodeEls=[];

// recompute layout: focus line nearest FRONT, fan it out
function layout(){
  // world angle of each line center = lc + rotation
  let best=null,bestd=1e9;
  LINES.forEach(l=>{
    let d=((l.lc+rotation-FRONT)%360+360)%360; if(d>180)d=360-d;
    if(d<bestd){bestd=d;best=l;}
  });
  focus=best;
  // spokes
  Object.keys(spokeEls).forEach(col=>spokeEls[col].classList.toggle('focus', focus&&focus.c===col));
  // nodes
  nodeEls.forEach(nd=>{
    const isFocus=focus&&nd.c===focus.c;
    const dev=nd.baseA-nd.lc;                    // deviation from line center
    let a=nd.lc+ (isFocus? dev*EXPAND : dev);    // fan out focused line
    a+=rotation;
    // keep labels upright
    nd.el.setAttribute('transform',`rotate(${a}) translate(${nd.r} 0)`);
    nd.tx.setAttribute('transform',`rotate(${-a})`);
  });
}
function applyRot(){layout();}

const wrap=document.getElementById('wrap');
wrap.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;wrap.classList.add('grab');});
window.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX;rotation+=dx*0.4;lastX=e.clientX;applyRot();});
window.addEventListener('pointerup',()=>{dragging=false;wrap.classList.remove('grab');});
window.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function rotBy(d){rotation+=d;applyRot();}

// legend: tap a line to spin it to front (align lc+rotation with FRONT)
document.getElementById('leglist').innerHTML=LINES.map(l=>`<span data-lc="${l.lc}" style="color:${l.c}"><i style="background:${l.c}"></i>${l.n}</span>`).join('');
document.querySelectorAll('#leglist span').forEach(sp=>{
  sp.addEventListener('click',()=>{rotation=(FRONT-parseFloat(sp.dataset.lc));applyRot();});
});

function openSheet(n){
  document.getElementById('s_name').textContent=n.name;
  document.getElementById('s_dates').textContent=(n.d||'dates unknown')+(n.g>=0?' · ancestor':' · descendant');
  const l=document.getElementById('s_line');l.textContent=n.g>=0?'ancestor line':'descendant line';l.style.background=n.c;
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){document.getElementById('sheet').classList.remove('open');}
applyRot();
</script>
</body>
</html>
